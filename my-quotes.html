<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#f4f8fb">
<title>我的報價</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.30.0/sdk.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f4f8fb;color:#18324a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif
}
.wrap{max-width:620px;margin:auto;padding:18px 14px 44px}
.card{
  background:white;border:1px solid #dce8ee;border-radius:20px;
  padding:24px 18px;text-align:center;box-shadow:0 6px 18px rgba(25,61,86,.06)
}
.icon{font-size:45px}
h1{font-size:25px;margin:9px 0 4px}
p{color:#667b8b;font-size:14px;line-height:1.6;margin:5px 0}
.loader{
  width:34px;height:34px;border:4px solid #dce8ee;border-top-color:#168c83;
  border-radius:50%;margin:20px auto 10px;animation:spin .8s linear infinite
}
.error{margin-top:14px;padding:12px;border-radius:12px;background:#fff0f0;color:#a03939;text-align:left;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon">💰</div>
    <h1>正在查詢我的報價</h1>
    <p>系統正在確認 LINE 身分並讀取您的報價紀錄。</p>
    <div class="loader"></div>
    <div id="status">正在連線…</div>
    <div id="error" class="error" style="display:none"></div>
  </div>
</div>

<form id="lookupForm" method="POST" style="display:none">
  <input type="hidden" name="action" value="lookupQuotes">
  <input type="hidden" name="idToken" id="idToken">
</form>

<script>
const LIFF_ID = "2011319653-aVI0Ar9E";

// ★ 請把這裡改成與 index.html 完全相同的 Apps Script /exec 網址
const API_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";

function showError(message){
  document.querySelector(".loader").style.display="none";
  document.getElementById("status").textContent="查詢失敗";
  const el=document.getElementById("error");
  el.style.display="block";
  el.textContent=message;
}

async function init(){
  try{
    if(!API_URL || API_URL.includes("PASTE_YOUR")){
      throw new Error("尚未設定 API_URL。請把 index.html 目前使用的 Apps Script /exec 網址複製到 my-quotes.html。");
    }

    await liff.init({liffId:LIFF_ID});

    if(!liff.isLoggedIn()){
      liff.login({redirectUri:window.location.href});
      return;
    }

    const token=liff.getIDToken();

    if(!token){
      throw new Error("無法取得 LINE ID Token，請從 LINE 官方帳號重新開啟「我的報價」。");
    }

    document.getElementById("idToken").value=token;

    const form=document.getElementById("lookupForm");
    form.action=API_URL;

    document.getElementById("status").textContent="身分確認完成，正在載入報價…";

    // POST 送到 Apps Script；ID Token 不放在網址 query string。
    form.submit();

  }catch(err){
    showError(err && err.message ? err.message : "系統連線失敗");
  }
}

window.addEventListener("load",init);
</script>
</body>
</html>
